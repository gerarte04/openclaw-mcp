services:
  rest-server:
    build: .
    env_file: .env
    volumes:
      # Spotify may rotate a refresh token during normal API use. The token
      # store writes it atomically with 0600 permissions.
      - ./data:/app/data
    ports:
      # Loopback by default; the Ansible deployment sets 0.0.0.0 to listen on
      # every interface.
      - "${REST_BIND_ADDRESS:-127.0.0.1}:${REST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    env_file: .env
    depends_on:
      rest-server:
        condition: service_healthy
    volumes:
      # OAuth clients and token digests only; the Telegram and Spotify
      # credentials stay out of this container.
      - ./data/oauth:/app/data/oauth
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8001}:8001"
    restart: unless-stopped

  # HTTPS reverse proxy for a public MCP endpoint (COMPOSE_PROFILES=public).
  caddy:
    image: caddy:2
    profiles: ["public"]
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:-}
    depends_on:
      - mcp-server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  telegram-auth:
    build: .
    profiles: ["auth"]
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "scripts/authorize_telegram.py"]

  spotify-auth:
    build: .
    profiles: ["spotify-auth"]
    env_file: .env
    environment:
      SPOTIFY_AUTH_BIND_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8888:8888"
    entrypoint: ["python", "scripts/authorize_spotify.py"]

volumes:
  caddy-data:
  caddy-config:
