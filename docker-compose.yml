services:
  rest-server:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    build: .
    command: ["python", "-m", "mcp_server.server"]
    env_file: .env
    depends_on:
      rest-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  telegram-auth:
    build: .
    profiles: ["auth"]
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "scripts/authorize_telegram.py"]
