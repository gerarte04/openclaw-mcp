# Where the project is copied on the server.
app_dir: /opt/openclaw-mcp
compose_project_name: openclaw-mcp

# Install Docker Engine and the Compose plugin from download.docker.com
# (Debian/Ubuntu). Set to false if Docker is already installed.
install_docker: true

# Public MCP endpoint for a Claude connector: Caddy listens on ports 80 and
# 443 of every interface, serves https://<mcp_domain>/mcp with an automatic
# certificate, and the MCP server requires OAuth. Point the domain's DNS
# record at the server first. false publishes no HTTPS endpoint and keeps
# OAuth off.
public_mcp: true
mcp_domain: example.com

# The REST service and the plain MCP port stay on loopback; set 0.0.0.0 only
# if they must be reachable without HTTPS and OAuth.
rest_bind_address: 127.0.0.1
rest_port: 8000
mcp_bind_address: 127.0.0.1
mcp_port: 8001

# OAuth redirect URIs a client may register (comma-separated). Empty keeps
# the application default: Claude's connector callbacks.
mcp_oauth_allowed_redirect_uris: ""

# The bot may send only to telegram_bot_default_chat_id and these chats
# (comma-separated), so text from Telegram posts cannot redirect it.
telegram_bot_allow_any_chat: false
telegram_bot_allowed_chat_ids: ""

# Secrets: define them in group_vars/all/vault.yml (see vault.example.yml).
telegram_api_id: "{{ vault_telegram_api_id | default('') }}"
telegram_api_hash: "{{ vault_telegram_api_hash | default('') }}"
spotify_client_id: "{{ vault_spotify_client_id | default('') }}"
lastfm_api_key: "{{ vault_lastfm_api_key | default('') }}"
telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
telegram_bot_default_chat_id: "{{ vault_telegram_bot_default_chat_id | default('') }}"
# The password you enter when connecting Claude to the MCP server.
mcp_oauth_password: "{{ vault_mcp_oauth_password | default('') }}"

# Additional .env settings, e.g. {INTEREST_DECAY_LAMBDA: 0.003}. They override
# the defaults rendered from templates/env.j2.
app_extra_env: {}

# Optional authorization files created locally (paths on the control machine).
# Leave empty to authorize on the server instead (see README.md).
telegram_session_local_path: ""
spotify_token_local_path: ""
# Spotify rotates its refresh token on the server, so existing files are kept
# unless this is true.
overwrite_auth_files: false

# authorize.yml: the phone number to log in to Telegram with (prompted when
# empty), and whether to authorize again even if a session or token exists.
telegram_phone: ""
telegram_reauthorize: false
spotify_reauthorize: false
