# Where the project is copied on the server.
app_dir: /opt/openclaw-mcp
compose_project_name: openclaw-mcp

# Install Docker Engine and the Compose plugin from download.docker.com
# (Debian/Ubuntu). Set to false if Docker is already installed.
install_docker: true

# Both services listen on every network interface. Use 127.0.0.1 (or a
# specific interface address) to restrict them.
rest_bind_address: 0.0.0.0
rest_port: 8000
mcp_bind_address: 0.0.0.0
mcp_port: 8001

# Secrets: define them in group_vars/all/vault.yml (see vault.example.yml).
telegram_api_id: "{{ vault_telegram_api_id | default('') }}"
telegram_api_hash: "{{ vault_telegram_api_hash | default('') }}"
spotify_client_id: "{{ vault_spotify_client_id | default('') }}"
lastfm_api_key: "{{ vault_lastfm_api_key | default('') }}"
telegram_bot_token: "{{ vault_telegram_bot_token | default('') }}"
telegram_bot_default_chat_id: "{{ vault_telegram_bot_default_chat_id | default('') }}"

# Additional .env settings, e.g. {INTEREST_DECAY_LAMBDA: 0.003}. They override
# the defaults rendered from templates/env.j2.
app_extra_env: {}

# Optional authorization files created locally (paths on the control machine).
# Leave empty to authorize on the server instead (see README.md).
telegram_session_local_path: ""
spotify_token_local_path: ""
# Spotify rotates its refresh token on the server, so existing files are kept
# unless this is true.
overwrite_auth_files: false
